<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>THE GATEWAY</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <!--
      THE GATEWAY's web page (Unity WebGL template "Gateway", in Assets/WebGLTemplates/Gateway).
      - The game fills the whole browser window on a black page.
      - Rendering is capped at 1 pixel per CSS pixel. On a Retina/HiDPI laptop the default (2x) draws four times
        as many pixels every frame, which is the biggest single cost for a browser game.
      - "Loading..." and a progress bar in the game's colours instead of the Unity footer.
      - Progressive asset loading (Web build profile): only what the menu needs downloads before the game starts;
        later levels stream in the background while you play.
      - The engine's code files are requested with a version stamp taken from when this page was published, so after
        an update a browser never runs new code with an old cached engine (data files are re-checked by Unity's cache).
    -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #000; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 22px; color: #e8f2ff; font: 600 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.32em; }
      #loading .title { font-size: 22px; font-weight: 300; letter-spacing: 0.3em; }
      #loading .track { width: min(420px, 70vw); height: 3px; background: rgba(140, 215, 255, 0.18); }
      #loading .fill { width: 0%; height: 100%; background: #8cd8ff; transition: width 0.2s; }
      #warning { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); max-width: 80vw; color: #000; font: 14px system-ui, sans-serif; }
      #fullscreen { position: fixed; right: 14px; bottom: 12px; width: 34px; height: 34px; border: 1px solid rgba(140, 215, 255, 0.4);
                    background: rgba(5, 10, 16, 0.6); color: #8cd8ff; font: 18px system-ui, sans-serif; cursor: pointer; opacity: 0.55; display: none; }
      #fullscreen:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div class="title">Loading...</div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <div id="warning"></div>
    <button id="fullscreen" title="Full screen">⤢</button>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style = "padding: 8px 12px; margin-bottom: 6px; background: " + (type == "error" ? "#ff6b5e" : "#ffd75e") + ";";
        banner.appendChild(div);
        if (type != "error") setTimeout(function () { banner.removeChild(div); }, 5000);
      }

      // Version stamp for this deployment (see the note at the top).
      var stamp = "?v=" + (Date.parse(document.lastModified) || Date.now());
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webtest.loader.js" + stamp;
      var config = {
        arguments: [],
        primaryDataUrls: ["globalgamemanagers","globalgamemanagers.assets","level0","resources.assets","resources.resource","Resources/unity_builtin_extra","RuntimeInitializeOnLoads.json","ScriptingAssemblies.json","sharedassets0.assets","boot.config","Il2CppData/Metadata/global-metadata.dat","Resources/unity default resources"],
        secondaryDataUrls: ["level1","sharedassets1.assets","level2","sharedassets2.assets","level3","sharedassets3.assets","level4","sharedassets4.assets","level5","sharedassets5.assets","level6","sharedassets6.assets","level7","sharedassets7.assets","level8","sharedassets8.assets","level9","sharedassets9.assets"],
        frameworkUrl: buildUrl + "/webtest.framework.js",
        codeUrl: buildUrl + "/webtest.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "TSA Video Game Design 2027",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // One rendered pixel per CSS pixel, even on Retina screens (see the note at the top).
        devicePixelRatio: 1,
      };
      // Only the engine's code files get the stamp. The data files keep their plain names (with progressive loading
      // Unity uses them as file names), and Unity's data cache re-checks them with the server on every launch.
      ["frameworkUrl", "codeUrl", "symbolsUrl"].forEach(function (k) {
        if (typeof config[k] === "string") config[k] += stamp;
      });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          document.querySelector("#loading").style.display = "none";
          var fs = document.querySelector("#fullscreen");
          fs.style.display = "block";
          fs.onclick = function () { unityInstance.SetFullscreen(1); };
          canvas.focus();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
